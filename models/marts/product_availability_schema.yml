version: 2

models:
  - name: fct_product_countries
    description: >
      Fact model showing product availability by country and date.
      Based on logic from allowed and disallowed country arrays in source data.
      Includes readable country names for use in BI tools.
      Potential future enhancement:
      A regional mapping (e.g., continents or sales regions) could be added by 
      joining `stg_data_source_countries` to a `country_region_map` table using country_code
      or ISO-3 as a key.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_id
            - date
            - country_code
    meta:
      team: analytics_engineering
      used_in: looker
      exposed: true
    columns:
      - name: product_id
        description: "Unique identifier for the product"
        tests: [not_null]

      - name: date
        description: "Date the product rule applies"
        tests: [not_null]

      - name: country_code
        description: "Alpha-2 country code representing the country"
        tests: [not_null]

      - name: country_name
        description: "Standard full name of the country (e.g., 'France')"

      - name: country_name_looker
        description: "Formatted country name used for display in Looker"

      - name: is_available
        description: "Boolean flag indicating if the product is available in the country on that date"